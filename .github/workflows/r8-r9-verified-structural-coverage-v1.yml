name: R8 R9 verified structural coverage V1
on:
  push:
    paths:
      - 'scripts/audit_r8_r9_verified_structural_coverage_v1.py'
      - '.github/workflows/r8-r9-verified-structural-coverage-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/audit_r8_r9_verified_structural_coverage_v1.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_acceptance/R8_R9_VERIFIED_STRUCTURAL_COVERAGE_V1.md'
          git diff --cached --quiet || git commit -m 'audit: revalidate R8/R9 structural coverage'
          git push
