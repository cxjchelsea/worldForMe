name: inspect-m-axis-bib-registry-v1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_m_axis_bib_registry_v1.py'
      - '.github/workflows/inspect-m-axis-bib-registry-v1.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/inspect_m_axis_bib_registry_v1.py
