name: P2 cross-source T-axis audit V1

on:
  push:
    paths:
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_CROSS_SOURCE_V1'
      - 'scripts/audit_p2_cross_source_v1.py'
      - '.github/workflows/p2-cross-source-v1.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run authorized P2 cross-source audit
        if: ${{ hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_CROSS_SOURCE_V1') != '' }}
        run: python scripts/audit_p2_cross_source_v1.py
      - name: Commit P2 cross-source audit
        if: ${{ hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_CROSS_SOURCE_V1') != '' }}
        run: |
          rm '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_CROSS_SOURCE_V1'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness' scripts/audit_p2_cross_source_v1.py
          git commit -m 'audit: record P2 cross-source T-axis candidates' || exit 0
          git push
