name: m31-bibliography-cleanup-v1

on:
  push:
    branches:
      - topic/m-axis-m3.1-v2
    paths:
      - scripts/apply_m31_bibliography_cleanup_v1.py
      - .github/workflows/m31-bibliography-cleanup-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: topic/m-axis-m3.1-v2

      - name: Apply M3.1 cleanup and gap-fill
        run: python scripts/apply_m31_bibliography_cleanup_v1.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "个人通识知识系统_v2_A2/30 世界文学/40 作品"
          git commit -m "fix(m3.1): clean corpus and fill structural bibliography gaps"
          git push origin HEAD:topic/m-axis-m3.1-v2
