name: Missing-T year backfill export V1
on:
  push:
    paths:
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_year_backfill/RUN_MISSING_T_YEAR_BACKFILL_EXPORT_V1'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export missing-T year backfill table
        run: python scripts/export_missing_t_year_backfill_v1.py
      - name: Commit export
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_year_backfill'
          git commit -m 'audit: export missing-T year backfill V1'
          git push
