name: P2 Wikidata serial audit V2

on:
  push:
    paths:
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_WIKIDATA_SERIAL_V2'
      - 'scripts/audit_p2_wikidata_serial_v2.py'
      - '.github/workflows/p2-wikidata-serial-v2.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run authorized rate-safe Wikidata P2 audit
        if: ${{ hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_WIKIDATA_SERIAL_V2') != '' }}
        run: python scripts/audit_p2_wikidata_serial_v2.py
      - name: Commit Wikidata P2 serial report
        if: ${{ hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_WIKIDATA_SERIAL_V2') != '' }}
        run: |
          rm '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_WIKIDATA_SERIAL_V2'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness' scripts/audit_p2_wikidata_serial_v2.py
          git commit -m 'audit: record rate-safe Wikidata P2 verification' || exit 0
          git push
