name: P2 Wikidata fast audit V3

on:
  push:
    paths:
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_WIKIDATA_FAST_V3'
      - 'scripts/audit_p2_wikidata_fast_v3.py'
      - '.github/workflows/p2-wikidata-fast-v3.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run authorized bounded-concurrency Wikidata P2 audit
        if: ${{ hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_WIKIDATA_FAST_V3') != '' }}
        run: python scripts/audit_p2_wikidata_fast_v3.py
      - name: Commit Wikidata P2 fast report
        if: ${{ hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_WIKIDATA_FAST_V3') != '' }}
        run: |
          rm '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_WIKIDATA_FAST_V3'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness' scripts/audit_p2_wikidata_fast_v3.py
          git commit -m 'audit: record bounded-concurrency Wikidata P2 verification' || exit 0
          git pull --rebase
          git push
