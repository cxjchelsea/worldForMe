name: literature-q-field-migration-v1

on:
  push:
    branches:
      - migration/literature-coordinate-network-20260907
    paths:
      - 'scripts/migrate_literature_q_fields.py'
      - '.github/workflows/literature-q-field-migration-v1.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/literature-coordinate-network-20260907
          fetch-depth: 0

      - name: Remove previous generated audit to avoid self-reference
        run: rm -f -- '个人通识知识系统_v2_A2/30 世界文学/04 系统架构/03 Q字段迁移审计.md'

      - name: Apply deterministic QH/QT migration and generate audit
        run: python scripts/migrate_literature_q_fields.py --apply

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit migrated work fields and audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '个人通识知识系统_v2_A2/30 世界文学/40 作品' \
                    '个人通识知识系统_v2_A2/30 世界文学/04 系统架构/03 Q字段迁移审计.md'
          if git diff --cached --quiet; then
            echo "No deterministic migration changes to commit."
          else
            git commit -m "migrate(literature): split legacy Q coordinates into QH and QT"
            git push origin HEAD:migration/literature-coordinate-network-20260907
          fi
