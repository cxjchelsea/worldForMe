name: R9 structural completion V1
on:
  push:
    paths:
      - 'scripts/complete_r9_topic_map_v1.py'
      - '.github/workflows/r9-structural-completion-v1.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/complete_r9_topic_map_v1.py
      - name: Commit R9 completion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git diff --cached --quiet || git commit -m "feat: complete R9 Oceania and Pacific literature topic map"
          git push
