name: Canonical work entity dedup V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_entity_dedup_v1.py'
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/entity_dedup/APPLY_ENTITY_DEDUP_V1'
      - '.github/workflows/entity-dedup-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dedup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply authorized canonical Work dedup V1
        if: hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/entity_dedup/APPLY_ENTITY_DEDUP_V1') != ''
        run: python scripts/apply_entity_dedup_v1.py

      - name: Commit canonical Work dedup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学'
          if git diff --cached --quiet; then
            echo "No entity dedup changes"
          else
            git commit -m "fix: merge duplicate canonical work entities"
            git push
          fi
