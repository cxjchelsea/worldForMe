name: One-time QC2 final acceptance cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qc2-final-acceptance.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize QC2 acceptance and freeze template
        run: python .github/scripts/qc2_finalize.py
      - name: Commit final QC2 state and remove one-time helpers
        shell: bash
        run: |
          rm -f .github/workflows/qc2-final-acceptance.yml .github/scripts/qc2_finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize QC2 acceptance and freeze component template'
          git push origin main
