name: R8 structural completion V1
# trigger: execute R8 completion after workflow registration
on:
  push:
    paths:
      - 'scripts/complete_r8_topic_map_v1.py'
      - '.github/workflows/r8-structural-completion-v1.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/complete_r8_topic_map_v1.py
      - name: Commit R8 completion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+cxjchelsea@users.noreply.github.com
          git add .
          git diff --cached --quiet || git commit -m "feat: complete R8 Southeast Asian literature topic map"
          git push
