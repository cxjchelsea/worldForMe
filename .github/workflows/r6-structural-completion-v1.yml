name: R6 structural completion V1
on:
  push:
    paths:
      - 'scripts/complete_r6_topic_map_v1.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/complete_r6_topic_map_v1.py
      - name: Commit R6 completion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git diff --cached --quiet || git commit -m "feat: complete R6 Latin American and Caribbean literature map"
          git push
