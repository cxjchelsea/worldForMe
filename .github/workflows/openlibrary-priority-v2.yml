name: Open Library priority missing-T V2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/resolve_missing_t_openlibrary_priority_v2.py'
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_OPENLIBRARY_PRIORITY_V2'
      - '.github/workflows/openlibrary-priority-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Resolve prioritized Open Library candidates
        if: hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_OPENLIBRARY_PRIORITY_V2') != ''
        run: python scripts/resolve_missing_t_openlibrary_priority_v2.py
      - name: Commit prioritized candidate report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness'
          if git diff --cached --quiet; then
            echo "No priority candidate report changes"
          else
            git commit -m "audit: record Open Library priority candidates V2"
            git push
          fi
