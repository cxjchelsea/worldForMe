name: R4 topic map build V1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_r4_topic_map_v1.py'
      - '.github/workflows/r4-topic-map-build-v1.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build_r4_topic_map_v1.py
      - name: Commit R4 topic map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/20 节点/R 地域/R4 欧洲文学.md' '个人通识知识系统_v2_A2/30 世界文学/30 专题/R4 欧洲文学'
          git commit -m "feat: build R4 Europe literature topic map V1"
          git pull --rebase origin main
          git push
