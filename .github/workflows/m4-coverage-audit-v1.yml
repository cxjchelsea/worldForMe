name: m4-coverage-audit-v1
on:
  push:
    branches: [topic/m-axis-m4-v2]
    paths:
      - 'scripts/audit_m4_coverage_v1.py'
      - '.github/workflows/m4-coverage-audit-v1.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/audit_m4_coverage_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: m4-coverage-audit
          path: |
            reports/m4_coverage_audit.md
            reports/m4_coverage_audit.json
