name: Work Topic Link Canonicalization

on:
  push:
    branches:
      - agent/world-literature-work-topic-link-canonicalization
    paths:
      - .github/workflows/work-topic-link-canonicalization.yml

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Canonicalize all migrated topic paths in work layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import OrderedDict

          root = Path("个人通识知识系统_v2_A2/30 作品")
          mappings = OrderedDict([
              ("20 专题地图/G 类型/G1 世界神话文学/", "20 专题地图/G 类型/G1.1 世界神话文学/"),
              ("20 专题地图/G 类型/G4.3 成长文学/", "20 专题地图/G 类型/G4.3.1 成长文学/"),
              ("20 专题地图/G 类型/G4.3 家族文学/", "20 专题地图/G 类型/G4.3.4 家族文学/"),
              ("20 专题地图/G 类型/G4.4 历史文学/", "20 专题地图/G 类型/G4.4.1 历史文学/"),
              ("20 专题地图/G 类型/G4.5 推理文学/", "20 专题地图/G 类型/G4.5.1 推理文学/"),
              ("20 专题地图/G 类型/G4.5 科幻文学/", "20 专题地图/G 类型/G4.5.2 科幻文学/"),
              ("20 专题地图/G 类型/G4.5 奇幻文学/", "20 专题地图/G 类型/G4.5.3 奇幻文学/"),
              ("20 专题地图/G 类型/G4.5 恐怖文学/", "20 专题地图/G 类型/G4.5.4 恐怖文学/"),
              ("20 专题地图/G 类型/G4.5 冒险文学/", "20 专题地图/G 类型/G4.5.5 冒险文学/"),
              ("20 专题地图/G 类型/G4.6 反乌托邦文学/", "20 专题地图/G 类型/G4.6.2 反乌托邦文学/"),
              ("20 专题地图/G 类型/G7 旅行文学/", "20 专题地图/G 类型/G7.4 旅行文学/"),
              ("20 专题地图/M 思潮/M3 现代主义文学/", "20 专题地图/M 思潮/M3.1 现代主义文学/"),
              ("20 专题地图/N 叙事/N2 不可靠叙述/", "20 专题地图/N 叙事/N2.2.2 不可靠叙述/"),
              ("20 专题地图/Q 主题/Q2 爱情文学/", "20 专题地图/Q 主题/Q2.1 爱情文学/"),
              ("20 专题地图/Q 主题/Q6 战争文学/", "20 专题地图/Q 主题/Q6.1 战争文学/"),
          ])

          if not root.is_dir():
              raise SystemExit(f"missing work root: {root}")

          counts = {old: 0 for old in mappings}
          changed_files = []
          scanned_files = 0

          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              data = path.read_bytes()
              scanned_files += 1
              new_data = data
              for old, new in mappings.items():
                  old_b = old.encode("utf-8")
                  n = new_data.count(old_b)
                  if n:
                      counts[old] += n
                      new_data = new_data.replace(old_b, new.encode("utf-8"))
              if new_data != data:
                  path.write_bytes(new_data)
                  changed_files.append(path.as_posix())

          residuals = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              data = path.read_bytes()
              for old in mappings:
                  n = data.count(old.encode("utf-8"))
                  if n:
                      residuals.append((path.as_posix(), old, n))

          total = sum(counts.values())
          print(f"SCANNED_FILES={scanned_files}")
          print(f"CHANGED_FILES={len(changed_files)}")
          print(f"REPLACED_OCCURRENCES={total}")
          for old, new in mappings.items():
              print(f"MAP {old} -> {new} : {counts[old]}")
          print("CHANGED_FILE_LIST_BEGIN")
          for name in changed_files:
              print(name)
          print("CHANGED_FILE_LIST_END")

          if total == 0:
              raise SystemExit("no legacy path occurrence found; refusing empty repair")
          if residuals:
              for path, old, n in residuals:
                  print(f"RESIDUAL {n} {old} :: {path}")
              raise SystemExit(f"legacy-path negative scan failed: {len(residuals)} residual groups")
          print("OLD_PATH_NEGATIVE_SCAN=PASS")
          PY

      - name: Enforce repair scope and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No work-layer changes found" >&2
            exit 1
          fi
          for f in "${changed[@]}"; do
            case "$f" in
              "个人通识知识系统_v2_A2/30 作品/"*) ;;
              *) echo "Out-of-scope change before commit: $f" >&2; exit 1 ;;
            esac
          done

          rm .github/workflows/work-topic-link-canonicalization.yml
          git add -A

          mapfile -t staged < <(git diff --cached --name-only)
          for f in "${staged[@]}"; do
            case "$f" in
              "个人通识知识系统_v2_A2/30 作品/"*) ;;
              ".github/workflows/work-topic-link-canonicalization.yml") ;;
              *) echo "Out-of-scope staged change: $f" >&2; exit 1 ;;
            esac
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "canonicalize work topic links"
          git push origin "HEAD:${GITHUB_REF_NAME}"
