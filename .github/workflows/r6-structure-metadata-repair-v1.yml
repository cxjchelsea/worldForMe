name: R6 structure metadata repair V1
on:
  push:
    paths:
      - 'scripts/repair_r6_structure_metadata_v1.py'
      - '.github/workflows/r6-structure-metadata-repair-v1.yml'
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/repair_r6_structure_metadata_v1.py
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git diff --cached --quiet || git commit -m "fix: repair R6 structure metadata"
          git push
