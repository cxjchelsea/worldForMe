name: R1 gap candidate scan V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/scan_r1_gap_candidates_v1.py'
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r1/SCAN_R1_GAP_CANDIDATES_V1'
      - '.github/workflows/r1-gap-candidate-scan-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan canonical Works for R1 structural candidates
        run: python scripts/scan_r1_gap_candidates_v1.py
      - name: Commit scan report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r1/R1_GAP_CANDIDATE_SCAN_V1.md'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: scan R1 structural gap candidates V1"
          git pull --rebase origin main
          git push
