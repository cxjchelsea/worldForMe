name: literature-namespace-v2-migration

on:
  push:
    branches:
      - migration/literature-physical-namespace-20260908
    paths:
      - 'scripts/migrate_literature_namespace_v2.py'
      - 'scripts/repair_literature_namespace_v2.py'
      - '.github/workflows/literature-namespace-v2-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/literature-physical-namespace-20260908
          fetch-depth: 0

      - name: Apply physical and namespace migration
        run: python scripts/migrate_literature_namespace_v2.py --apply

      - name: Repair moved navigation and namespace metadata
        shell: bash
        run: |
          python scripts/repair_literature_namespace_v2.py
          find '个人通识知识系统_v2_A2/30 世界文学/20 作品知识网络' -type f -name '*.md' -print0 \
            | xargs -0 sed -i 's/^legacy_axis: Q$/legacy_axis: "Q"/'
          python - <<'PY'
          from pathlib import Path

          root = Path('个人通识知识系统_v2_A2/30 世界文学/20 作品知识网络')
          specs = [
              (root / 'IM 意象/IM 文学意象与场景.md', 'IM'),
              (root / 'CN 文化叙事/CN 母题与叙事组件.md', 'CN'),
          ]
          for path, namespace in specs:
              text = path.read_text(encoding='utf-8')
              if f'namespace: {namespace}' not in text.split('---', 2)[1]:
                  text = text.replace(f'code: {namespace}\n', f'code: {namespace}\nnamespace: {namespace}\n', 1)
              text = text.replace('legacy_axis: Q', 'legacy_axis: "Q"')
              if namespace == 'IM':
                  text = text.replace('work_field: qx', 'work_field: imagery')
                  text = text.replace('作品页中的 `qx:` YAML', '作品页中的 `imagery:` YAML')
                  text = text.replace('`qx:`', '`imagery:`')
              if namespace == 'CN':
                  text = text.replace('物理目录 `20 节点/Q 主题/CN 母题/` 仅为兼容旧 WikiLink 保留。', '当前 canonical 物理目录为 `20 作品知识网络/CN 文化叙事/`；旧 Q 路径仅保存在迁移 provenance 中。')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate namespace v2 architecture
        run: python scripts/validate_literature_obsidian_links.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Validate Canvas JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('个人通识知识系统_v2_A2/30 世界文学')
          for name in ('01 世界文学总地图.canvas', '02 专题入口.canvas'):
              json.loads((root / name).read_text(encoding='utf-8'))
          print('canvas_json=PASS')
          PY

      - name: Commit migration result
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No namespace migration changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(literature): close namespace v2 navigation gaps'
          git push origin HEAD:migration/literature-physical-namespace-20260908
