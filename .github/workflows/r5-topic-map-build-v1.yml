name: R5 topic map build V1
on:
  push:
    paths:
      - 'scripts/build_r5_topic_map_v1.py'
      - '.github/workflows/r5-topic-map-build-v1.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build_r5_topic_map_v1.py
      - name: Commit R5 topic map
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git diff --cached --quiet || git commit -m "feat: build R5 North American literature topic map"
          git push
