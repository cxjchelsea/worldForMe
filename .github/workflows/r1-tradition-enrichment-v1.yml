name: R1 tradition enrichment V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_r1_tradition_enrichment_v1.py'
      - '.github/workflows/r1-tradition-enrichment-v1.yml'
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r1/APPLY_R1_TRADITION_ENRICHMENT_V1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_r1_tradition_enrichment_v1.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/40 作品' '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r1'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: enrich R1 work traditions V1"
          git pull --rebase
          git push
