name: Missing-T triage V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/triage_missing_t_v1.py'
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_MISSING_T_TRIAGE_V1'
      - '.github/workflows/missing-t-triage-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run missing-T triage
        if: hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_MISSING_T_TRIAGE_V1') != ''
        run: python scripts/triage_missing_t_v1.py
      - name: Commit missing-T triage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness'
          if git diff --cached --quiet; then
            echo "No triage report changes"
          else
            git commit -m "audit: record missing-T triage V1"
            git push
          fi
