name: R axis acceptance repair V1
on:
  push:
    paths:
      - 'scripts/repair_r_axis_acceptance_v1.py'
      - '.github/workflows/r-axis-acceptance-repair-v1.yml'
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/repair_r_axis_acceptance_v1.py
      - run: python scripts/audit_r_axis_acceptance_v1.py
      - name: Commit repair and audit
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git diff --cached --quiet || git commit -m "fix: repair and verify R-axis acceptance"
          git push
