name: Patch QC2 migration directory merge guard
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qc2-migration-refactor-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and retrigger migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/qc2-migration-refactor.yml')
          s=p.read_text(encoding='utf-8')
          old="""            if old.exists() and not new.exists(): shutil.move(str(old),str(new))
            new.mkdir(parents=True,exist_ok=True)
"""
          new="""            if old.exists():
              if not new.exists():
                shutil.move(str(old),str(new))
              else:
                for child in list(old.iterdir()):
                  target=new/child.name
                  assert not target.exists(), f'QC2 merge collision: {target}'
                  shutil.move(str(child),str(target))
                old.rmdir()
            new.mkdir(parents=True,exist_ok=True)
"""
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm -f .github/workflows/qc2-migration-refactor-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix QC2 migration directory merge guard'
          git push origin main
