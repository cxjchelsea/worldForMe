name: R1 structural gap fill V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_r1_structural_gap_fill_v1.py'
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r1/APPLY_R1_STRUCTURAL_GAP_FILL_V1'
      - '.github/workflows/r1-structural-gap-fill-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply complete R1 structural gap fill
        if: hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r1/APPLY_R1_STRUCTURAL_GAP_FILL_V1') != ''
        run: python scripts/apply_r1_structural_gap_fill_v1.py
      - name: Re-audit R1 structural coverage
        run: python scripts/audit_r1_structural_coverage_v1.py
      - name: Re-audit R1 topic coverage
        run: |
          printf 'authorized by R1 structural gap fill V1\n' > '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r1/RUN_R1_TOPIC_COVERAGE_V1'
          python scripts/audit_r1_topic_coverage_v1.py
      - name: Commit complete R1 structural gap fill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/40 作品' \
                  '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r1'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: complete R1 structural work coverage V1"
          git pull --rebase origin main
          git push
