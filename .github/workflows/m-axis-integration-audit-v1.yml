name: m-axis-integration-audit-v1
on:
  push:
    branches: [topic/m-axis-integration-closure-v1]
    paths:
      - 'scripts/audit_m_axis_integration_v1.py'
      - '.github/workflows/m-axis-integration-audit-v1.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: topic/m-axis-integration-closure-v1
          fetch-depth: 0
      - run: git fetch origin topic/m-axis-m5.2-v2:refs/remotes/origin/topic/m-axis-m5.2-v2
      - run: python scripts/audit_m_axis_integration_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: m-axis-integration-audit
          path: |
            reports/m_axis_integration_audit.md
            reports/m_axis_integration_audit.json
