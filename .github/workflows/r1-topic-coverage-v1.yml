name: R1 topic coverage audit V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_r1_topic_coverage_v1.py'
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r1/RUN_R1_TOPIC_COVERAGE_V1'
      - '.github/workflows/r1-topic-coverage-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run authorized R1 coverage audit
        if: hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r1/RUN_R1_TOPIC_COVERAGE_V1') != ''
        run: python scripts/audit_r1_topic_coverage_v1.py
      - name: Commit R1 coverage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r1'
          if git diff --cached --quiet; then
            echo "No R1 coverage report changes"
          else
            git commit -m "audit: record R1 topic coverage V1"
            git push
          fi
