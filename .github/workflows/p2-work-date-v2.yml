name: P2 work-level date V2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_p2_work_date_v2.py'
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_WORK_DATE_V2'
      - '.github/workflows/p2-work-date-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run P2 work-level date audit V2
        if: hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_WORK_DATE_V2') != ''
        run: python scripts/audit_p2_work_date_v2.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness'
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "audit: record P2 work-level date V2"
            git push
          fi
