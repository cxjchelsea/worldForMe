name: repair-m-axis-residual-yaml-v1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_m_axis_residual_yaml_v1.py'
      - '.github/workflows/repair-m-axis-residual-yaml-v1.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair residual malformed work YAML
        run: python scripts/repair_m_axis_residual_yaml_v1.py
      - name: Commit repaired works
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/40 作品'
          git commit -m 'fix(m-axis): repair residual work YAML'
          git push origin HEAD:main
