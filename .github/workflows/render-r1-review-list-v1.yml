name: Render R1 review list V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_r1_review_list_v1.py'
      - '.github/workflows/render-r1-review-list-v1.yml'
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r1/RUN_RENDER_R1_REVIEW_LIST_V1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/render_r1_review_list_v1.py
      - name: Commit rendered list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r1/R1_REVIEW_LIST_V1.md'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: render R1 semantic review list V1"
          git push
