name: R7 structural completion V1
on:
  push:
    paths:
      - 'scripts/complete_r7_topic_map_v1.py'
      - '.github/workflows/r7-structural-completion-v1.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalize R7 Horn tradition label
        run: sed -i 's/厄立里亚/厄立特里亚/g' scripts/complete_r7_topic_map_v1.py
      - run: python scripts/complete_r7_topic_map_v1.py
      - name: Commit R7 completion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git diff --cached --quiet || git commit -m "feat: complete R7 African literature topic map"
          git push
