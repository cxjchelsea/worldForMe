name: T-axis audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_t_axis.py'
      - 'scripts/enrich_t_axis_audit.py'
      - 'scripts/summarize_t_axis_stage1.py'
      - 'scripts/manual_t0_t2_review.py'
      - 'scripts/build_t_axis_compact_review.py'
      - 'scripts/apply_t_axis_corrections_v1.py'
      - '世界文学经典母库_V1.csv'
      - '世界文学经典母库_V2_增量_CANON-196-300.csv'
      - '个人通识知识系统_v2_A2/30 世界文学/40 作品/**'
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis/APPLY_T_AXIS_CORRECTIONS_V1'
      - '.github/workflows/t-axis-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply authorized T-axis correction V1
        if: hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis/APPLY_T_AXIS_CORRECTIONS_V1') != ''
        run: python scripts/apply_t_axis_corrections_v1.py

      - name: Run full T-axis inventory scan
        run: python scripts/audit_t_axis.py

      - name: Run canonical-date semantic screening
        run: python scripts/enrich_t_axis_audit.py

      - name: Split focused candidate reports
        run: python scripts/summarize_t_axis_stage1.py

      - name: Persist manual T0-T2 screening
        run: python scripts/manual_t0_t2_review.py

      - name: Build compact population review views
        run: python scripts/build_t_axis_compact_review.py

      - name: Commit correction and audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/40 作品'
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis'
          if git diff --cached --quiet; then
            echo "No correction or audit report changes"
          else
            git commit -m "fix: apply reviewed T-axis corrections"
            git push
          fi
