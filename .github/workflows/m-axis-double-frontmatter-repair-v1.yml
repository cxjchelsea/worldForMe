name: m-axis-double-frontmatter-repair-v1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_double_frontmatter_m_axis_v1.py'
      - '.github/workflows/m-axis-double-frontmatter-repair-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair duplicate frontmatter
        run: python scripts/repair_double_frontmatter_m_axis_v1.py
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/40 作品'
          git commit -m 'fix(m-axis): merge duplicate work frontmatter'
          git push origin HEAD:main
