name: P2 author lifespan sanity V1
on:
  push:
    paths:
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_AUTHOR_LIFESPAN_V1'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run lifespan audit
        run: python scripts/audit_p2_author_lifespan_v1.py
      - name: Commit report
        run: |
          rm -f '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_AUTHOR_LIFESPAN_V1'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness'
          git commit -m 'audit: apply P2 author lifespan sanity gate' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
