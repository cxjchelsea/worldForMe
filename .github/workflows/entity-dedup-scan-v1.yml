name: Canonical work duplicate scan V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/scan_work_entity_duplicates_v1.py'
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/entity_dedup_scan/RUN_ENTITY_DEDUP_SCAN_V1'
      - '.github/workflows/entity-dedup-scan-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run authorized read-only duplicate candidate scan
        if: hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/entity_dedup_scan/RUN_ENTITY_DEDUP_SCAN_V1') != ''
        run: python scripts/scan_work_entity_duplicates_v1.py

      - name: Commit duplicate scan report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/entity_dedup_scan'
          if git diff --cached --quiet; then
            echo "No duplicate scan report changes"
          else
            git commit -m "audit: record canonical work duplicate scan V1"
            git push
          fi
