name: m2-candidate-audit-v1

on:
  push:
    branches:
      - topic/m-axis-m2-v2
    paths:
      - 'scripts/audit_m2_candidates_v1.py'
      - '个人通识知识系统_v2_A2/30 世界文学/40 作品/**'
      - '.github/workflows/m2-candidate-audit-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run M2 candidate audit
        run: python scripts/audit_m2_candidates_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: m2-candidate-audit
          path: |
            reports/m2_candidate_audit.md
            reports/m2_candidate_audit.json
