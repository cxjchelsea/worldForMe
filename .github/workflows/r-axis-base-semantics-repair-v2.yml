name: R axis base semantics repair V2
on:
  push:
    paths:
      - 'scripts/repair_r_axis_base_semantics_v2.py'
      - '.github/workflows/r-axis-base-semantics-repair-v2.yml'
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/repair_r_axis_base_semantics_v2.py
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git diff --cached --quiet || git commit -m "fix: repair R-axis base semantics and metadata"
          git push
