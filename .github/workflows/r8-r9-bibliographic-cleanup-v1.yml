name: R8 R9 bibliographic cleanup V1
on:
  push:
    paths:
      - 'scripts/apply_r8_r9_bibliographic_cleanup_v1.py'
      - '.github/workflows/r8-r9-bibliographic-cleanup-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_r8_r9_bibliographic_cleanup_v1.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/40 作品' \
                  '个人通识知识系统_v2_A2/30 世界文学/30 专题/R8 东南亚文学/00 东南亚文学.md' \
                  '个人通识知识系统_v2_A2/30 世界文学/30 专题/R9 大洋洲与太平洋文学/00 大洋洲与太平洋文学.md' \
                  '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_acceptance/R8_R9_BIBLIOGRAPHIC_CLEANUP_V1.md'
          git diff --cached --quiet || git commit -m 'fix: clean R8/R9 bibliographic placeholders'
          git push
