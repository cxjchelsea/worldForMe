name: Missing-T reprint risk batch 1 V1
on:
  push:
    paths:
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_year_backfill/RUN_MISSING_T_REPRINT_BATCH1_V1'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frozen reprint-risk batch 1
        run: python scripts/build_missing_t_reprint_batch1_v1.py
      - name: Commit batch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_year_backfill/REPRINT_BATCH1_V1.csv' '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_year_backfill/REPRINT_BATCH1_V1.md'
          git commit -m 'audit: freeze missing-T reprint batch 1'
          git pull --rebase origin main
          git push
