name: R2 topic coverage audit V1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_r2_topic_coverage_v1.py'
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r2/RUN_R2_TOPIC_COVERAGE_V1'
      - '.github/workflows/r2-topic-coverage-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run R2 topic coverage audit
        run: python scripts/audit_r2_topic_coverage_v1.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r2'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: record R2 topic coverage V1"
          git push
