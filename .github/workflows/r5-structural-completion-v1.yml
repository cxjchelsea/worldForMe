name: R5 structural completion V1
on:
  push:
    paths:
      - 'scripts/apply_r5_structural_completion_v1.py'
      - '.github/workflows/r5-structural-completion-v1.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_r5_structural_completion_v1.py
      - name: Commit R5 completion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git diff --cached --quiet || git commit -m "feat: complete R5 North American literature structural coverage"
          git push
