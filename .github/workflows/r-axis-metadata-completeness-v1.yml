name: R axis metadata completeness V1
on:
  push:
    paths:
      - 'scripts/audit_r_axis_metadata_completeness_v1.py'
      - '.github/workflows/r-axis-metadata-completeness-v1.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/audit_r_axis_metadata_completeness_v1.py
      - name: Commit audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git diff --cached --quiet || git commit -m "audit: record R-axis metadata completeness"
          git push
