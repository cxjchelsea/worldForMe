name: diagnose-m-axis-residual-membership-v1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_m_axis_residual_membership_v1.py'
      - '.github/workflows/diagnose-m-axis-residual-membership-v1.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/diagnose_m_axis_residual_membership_v1.py
