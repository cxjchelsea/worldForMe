name: m-axis-structure-metadata-repair-v1
on:
  push:
    branches: [topic/m-axis-integration-closure-v1]
    paths:
      - 'scripts/repair_m_axis_structure_metadata_v1.py'
      - '.github/workflows/m-axis-structure-metadata-repair-v1.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: topic/m-axis-integration-closure-v1
          fetch-depth: 0
      - run: git fetch origin topic/m-axis-m5.2-v2:refs/remotes/origin/topic/m-axis-m5.2-v2
      - run: python scripts/repair_m_axis_structure_metadata_v1.py
      - run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "个人通识知识系统_v2_A2/30 世界文学/30 专题"
          git commit -m "fix(m-axis): preserve structure metadata in T-style schema"
          git push origin HEAD:topic/m-axis-integration-closure-v1
