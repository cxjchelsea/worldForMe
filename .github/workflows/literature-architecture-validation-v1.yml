name: literature-architecture-validation-v2

on:
  pull_request:
    paths:
      - '个人通识知识系统_v2_A2/30 世界文学/**'
      - 'scripts/migrate_literature_namespace_v2.py'
      - 'scripts/validate_literature_obsidian_links.py'
      - '.github/workflows/literature-architecture-validation-v1.yml'
  push:
    branches:
      - main
    paths:
      - '个人通识知识系统_v2_A2/30 世界文学/**'
      - 'scripts/migrate_literature_namespace_v2.py'
      - 'scripts/validate_literature_obsidian_links.py'
      - '.github/workflows/literature-architecture-validation-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Validate TH TY IM CN architecture
        run: python scripts/validate_literature_obsidian_links.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Ensure validation is read-only
        run: git diff --exit-code
