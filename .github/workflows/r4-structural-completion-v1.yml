name: R4 structural completion V1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_r4_structural_completion_v1.py'
      - '.github/workflows/r4-structural-completion-v1.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_r4_structural_completion_v1.py
      - name: Commit R4 completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/40 作品' '个人通识知识系统_v2_A2/30 世界文学/30 专题/R4 欧洲文学' '个人通识知识系统_v2_A2/30 世界文学/_audit/r_axis_r4'
          git commit -m "feat: complete R4 Europe literature structural coverage V1"
          git pull --rebase origin main
          git push
