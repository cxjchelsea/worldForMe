name: QX Render Views

on:
  push:
    branches: [main]
    paths:
      - '个人通识知识系统_v2_A2/30 世界文学/40 作品/**.md'
      - '个人通识知识系统_v2_A2/30 世界文学/30 专题/QX 文学意象与场景/10 已激活专题/**.md'
      - 'scripts/_qx_index_build.py'
      - '.github/workflows/qx-render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Render QX views
        run: python scripts/_qx_index_build.py

      - name: Commit generated views
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'QX views are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '个人通识知识系统_v2_A2/30 世界文学/40 作品' \
                  '个人通识知识系统_v2_A2/30 世界文学/30 专题/QX 文学意象与场景/04 意象关系索引.md' \
                  '个人通识知识系统_v2_A2/30 世界文学/30 专题/QX 文学意象与场景/05 作品意象一览.md'
          git commit -m 'chore(qx): refresh rendered views'
          git push
