name: m-axis-obsidian-membership-gap-audit-v1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_m_axis_obisidian_membership_gap_v1.py'
      - '.github/workflows/m-axis-obsidian-membership-gap-audit-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Audit Obsidian-readable M-axis membership
        run: python scripts/audit_m_axis_obisidian_membership_gap_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m-axis-obsidian-membership-gap-v1
          path: reports/m_axis_obsidian_membership_gap_v1.md
