name: Missing-T publication year research V1
on:
  push:
    paths:
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_year_backfill/RUN_MISSING_T_YEAR_RESEARCH_V1'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Research missing-T publication years
        run: python scripts/research_missing_t_years_v1.py
      - name: Commit research outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_year_backfill'
          git commit -m 'audit: research missing-T publication years V1'
          git push
