name: Open Library missing-T candidates V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/resolve_missing_t_openlibrary_v1.py'
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_OPENLIBRARY_YEAR_CANDIDATES_V1'
      - '.github/workflows/openlibrary-missing-t-candidates-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Resolve Open Library year candidates
        if: hashFiles('个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_OPENLIBRARY_YEAR_CANDIDATES_V1') != ''
        run: python scripts/resolve_missing_t_openlibrary_v1.py
      - name: Commit Open Library candidate report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness'
          if git diff --cached --quiet; then
            echo "No candidate report changes"
          else
            git commit -m "audit: record Open Library missing-T candidates V1"
            git push
          fi
