name: P2 source-ref year recovery V1
on:
  push:
    paths:
      - '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_SOURCE_REF_YEARS_V1'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install yaml
        run: pip install pyyaml
      - name: Run provenance audit
        run: python scripts/audit_p2_source_ref_years_v1.py
      - name: Commit report
        run: |
          rm -f '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness/RUN_P2_SOURCE_REF_YEARS_V1'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '个人通识知识系统_v2_A2/30 世界文学/_audit/t_axis_completeness'
          git commit -m 'audit: recover P2 years from source refs' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
